name: Build Windows CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: 1.2.3)"
        required: true
        type: string
      upload_release:
        description: "上传到 Releases"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows-cli:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Windows CLI
        run: |
          cd packages/opencode
          bun run ./script/build.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version }}

      - name: Package Windows binary
        shell: pwsh
        run: |
          cd packages/opencode/dist
          $zipName = "opencode-windows-x64.zip"
          Compress-Archive -Path "opencode-windows-x64\bin\*" -DestinationPath $zipName
          Write-Host "Created $zipName"
          Get-ChildItem *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: packages/opencode/dist/opencode-windows-x64.zip

      - name: Create Release and Upload
        if: inputs.upload_release
        uses: softprops/action-gh-release@v1
        with:
          repository: Silver-Larry/opencode-xxfork
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            packages/opencode/dist/opencode-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Release URL
        if: inputs.upload_release
        run: |
          Write-Host "Release created: https://github.com/Silver-Larry/opencode-xxfork/releases/tag/v${{ inputs.version }}"
